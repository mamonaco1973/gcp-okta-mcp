<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="590" viewBox="0 0 1620 590" role="img" aria-label="Claude reaches gcp-okta-mcp-func, a public second-generation Cloud Function that is both an OAuth authorization server and the MCP server. Claude probes /mcp, discovers the authorization server, registers itself, and sends the user's browser through /authorize to your Okta org's custom authorization server; the function exchanges the code for tokens and returns the Okta access token, a JWT, to Claude. Login state lives in Firestore with TTL policies, and the Okta client secret comes from Secret Manager. MCP calls on /mcp carry the access token, which the function validates locally against Okta's JWKS, pinning the issuer, audience and client ID, and the ten tools query Cloud Asset Inventory and Cloud Storage as the gcp-okta-mcp-sa service account."><defs><marker id="a_e_mcp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_login" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="a_e_code" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="a_e_state" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a_e_kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="a_e_rg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker></defs><rect width="1620" height="590" fill="#ffffff"/><path d="M250.0,150 V1